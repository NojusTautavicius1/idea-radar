name: Daily digest

on:
  schedule:
    - cron: "0 6 * * *" # 08:00 in Lithuania in winter, 09:00 in summer
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: print the digest, don't send or save"
        type: boolean
        default: false

concurrency: digest

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build and send the digest
        run: npm run digest -- ${{ inputs.dry && '--dry' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save state and archive
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests
          git diff --cached --quiet || git commit -m "Digest $(date -u +%F)"
          git push
